[plugin]
id = "steam-discreet"
name = "Steam Discreet"
version = "0.1.0"
author = "attl8d"
description = "Hides games you tag from ordinary Library browsing until one toggle reveals them."

[assets]
resources = ["resources/**/*"]

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
# Development builds go straight into Millennium's plugins folder on the dev PC.
# Millennium v3.6.3 packs each plugin into one <id>.star file there, so the
# path names the file, not the folder. "auto" resolves the same file from the
# Steam path in the registry.
output_path = "C:/Program Files (x86)/Steam/millennium/plugins/steam-discreet.star"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
padding = 0
backend_prefix  = "BCK"
frontend_prefix = "FRT"
webview_prefix  = "WEB"

[patches]
# Surfaces url_seen / match / no_match / conflict events while hooks are developed.
debug = true
